<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="45%" stop-color="#12121c"/>
      <stop offset="100%" stop-color="#1a0f14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff3b3b" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ff3b3b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- decorative katana blade sweep -->
  <g opacity="0.16">
    <path d="M -50 300 Q 400 40 1250 60" stroke="#ffffff" stroke-width="3" fill="none"/>
    <path d="M -50 315 Q 400 60 1250 80" stroke="#ff5c5c" stroke-width="1.5" fill="none"/>
  </g>

  <!-- faint circles like moon / tsuba -->
  <circle cx="1030" cy="80" r="60" fill="#ffffff" opacity="0.04"/>
  <circle cx="1030" cy="80" r="40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <circle cx="150" cy="290" r="90" fill="#ff3b3b" opacity="0.05"/>

  <!-- decorative thin lines suggesting blade edge -->
  <line x1="80" y1="330" x2="1120" y2="330" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <polygon points="900,40 940,55 900,70 920,55" fill="#ffffff" opacity="0.10"/>
  <polygon points="260,50 285,60 260,70 275,60" fill="#ff5c5c" opacity="0.10"/>

  <!-- headline -->
  <text x="600" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58.0" font-weight="bold" fill="#ffffff">
    <tspan x="600" dy="0">+1 Katana Evolution Script</tspan>
  </text>

  <!-- tagline -->
  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Pluggable module for the Kat</tspan>
  </text>
</svg>